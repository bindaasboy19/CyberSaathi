<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSaathi Shield - Suspicious Link Blocked</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(31, 41, 55, 0.45);
      --red: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --sky: #38bdf8;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      background-image: radial-gradient(circle at center, #7f1d1d 0%, #030712 100%);
    }

    .container {
      max-width: 600px;
      width: 90%;
      background: var(--card-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(239, 68, 68, 0.1);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 1px solid var(--red);
      color: var(--red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .icon {
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .url-block {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 14px;
      color: var(--red);
      word-break: break-all;
      margin: 20px 0;
      border: 1px solid rgba(239, 68, 68, 0.1);
    }

    p.description {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 30px;
    }

    .reason-box {
      background: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--red);
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      margin-bottom: 30px;
      font-size: 13px;
      line-height: 1.5;
    }

    .reason-title {
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--red);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-primary:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .bypass {
      font-size: 11px;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      margin-top: 15px;
      background: none;
      border: none;
    }

    .bypass:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <span class="icon">⚠️</span>
    </div>
    <h1>Deceptive Site Ahead</h1>
    <p class="description">CyberSaathi Shield has blocked access to this link because it exhibits scam behaviors or phishing signatures.</p>
    
    <div class="url-block" id="blocked-url">Loading URL...</div>

    <div class="reason-box">
      <div class="reason-title">AI Threat Analysis:</div>
      <div id="threat-reason">Checking threat reason...</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="go-back-btn">Take Me Back to Safety</button>
      <button class="bypass" id="bypass-btn">Proceed anyway (Not Recommended)</button>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
