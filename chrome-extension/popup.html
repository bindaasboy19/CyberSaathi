<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSaathi Shield</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #0284c7;
      --red: #ef4444;
      --green: #10b981;
      --amber: #f59e0b;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      font-size: 20px;
    }

    .title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version {
      font-size: 10px;
      color: var(--muted);
    }

    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 8px;
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--primary);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      padding: 10px;
      font-size: 12px;
      resize: none;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .verdict-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .verdict-low { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px dashed var(--green); }
    .verdict-medium { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px dashed var(--amber); }
    .verdict-high { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px dashed var(--red); }

    .score-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      border: 2px solid;
    }

    .explanation {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 12px;
      margin: 0;
      font-size: 11px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    input[type="text"] {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      padding: 8px;
      font-size: 12px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .status-msg {
      font-size: 11px;
      color: var(--primary);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo">🛡️</span>
      <span class="title">CyberSaathi Shield</span>
    </div>
    <span class="version">v1.0.0</span>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab active" data-tab="scan">Analyzer</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <!-- Scan Tab Content -->
    <div class="tab-content active" id="tab-scan">
      <textarea id="scan-input" rows="4" placeholder="Paste link, SMS, message, or email text here to scan..."></textarea>
      <button class="btn" id="scan-btn">Scan Content</button>

      <div class="status-msg" id="loading-msg" style="display: none;">Analyzing safety with Dual AI...</div>

      <!-- Result -->
      <div class="result-container" id="result-box">
        <div class="result-header">
          <span class="verdict-badge" id="result-verdict">LOW RISK</span>
          <div class="score-circle" id="result-score">0%</div>
        </div>
        <div class="explanation" id="result-explanation">Explanation here</div>
        <div style="font-weight: bold; font-size: 11px; margin-top: 4px;">Recommended Actions:</div>
        <ul class="actions-list" id="result-actions"></ul>
      </div>
    </div>

    <!-- Settings Tab Content -->
    <div class="tab-content" id="tab-settings">
      <div class="input-group">
        <span class="input-label">CyberSaathi Backend API Address</span>
        <input type="text" id="api-base-input" placeholder="http://localhost:3000">
      </div>
      <button class="btn" id="save-settings-btn">Save Settings</button>
      
      <div style="margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;">
        <span class="input-label">Threat intelligence Cache</span>
        <button class="btn" id="clear-cache-btn" style="background: var(--red); margin-top: 6px; width: 100%;">Clear Checked Domains Cache</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
